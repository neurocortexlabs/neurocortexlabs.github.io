name: Bug report
description: Something on the site is broken or looks wrong
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where on the page?
      placeholder: e.g. the focus areas grid, the mobile menu
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 18 on iPhone 15, Firefox 130 on Windows
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else
    validations:
      required: false
